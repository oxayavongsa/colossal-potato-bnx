<style>
#spud{position:fixed;left:10px;bottom:76px;width:78px;height:100px;z-index:50;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
#spud svg{width:100%;height:100%;overflow:visible;display:block}
#spud .bod{transform-origin:313px 800px;transform-box:view-box}
#spud .shadow{transform-origin:313px 800px;transform-box:view-box}
#spud .lid{transform:scaleY(0)}
#spud .lid.shut{transform:scaleY(1)}
#spud .lid.blink{animation:sBlink .2s}
@keyframes sBlink{50%{transform:scaleY(1)}}
#spud.idle .bod{animation:sBreathe 3.2s ease-in-out infinite}
@keyframes sBreathe{50%{transform:scale(1.025,.975)}}
#spud.jump .bod{animation:sJump .7s cubic-bezier(.3,.7,.4,1)}
@keyframes sJump{0%{transform:scale(1.12,.84)}35%{transform:translateY(-420px) scale(.94,1.08)}60%{transform:translateY(-420px)}85%{transform:scale(1.15,.85)}100%{transform:none}}
#spud.jump .shadow,#spud.spin .shadow{animation:sShad .7s}
@keyframes sShad{35%,60%{transform:scale(.5);opacity:.4}}
#spud.fall .bod{animation:sFall 2.3s ease}
@keyframes sFall{0%{transform:none}22%{transform:rotate(-12deg)}42%{transform:rotate(96deg) translate(-20px,60px)}48%{transform:rotate(86deg) translate(-20px,60px)}54%,78%{transform:rotate(90deg) translate(-20px,60px)}100%{transform:none}}
#spud.spin .bod{animation:sSpin .8s ease-in-out}
@keyframes sSpin{30%{transform:translateY(-220px) rotate(180deg)}60%{transform:translateY(-220px) rotate(360deg)}100%{transform:rotate(360deg)}}
#spud.squish .bod{animation:sSquish .6s}
@keyframes sSquish{20%{transform:scale(1.25,.7)}45%{transform:scale(.88,1.15)}70%{transform:scale(1.06,.95)}}
#spud.wiggle .bod{animation:sWig .75s}
@keyframes sWig{20%,60%{transform:rotate(-9deg)}40%,80%{transform:rotate(9deg)}}
#spud.dance .bod{animation:sDance .45s 4 ease-in-out}
@keyframes sDance{25%{transform:translate(-40px,-100px) rotate(-9deg)}75%{transform:translate(40px,-100px) rotate(9deg)}}
#spud.hop .bod{animation:sHop .45s 2 ease-out}
@keyframes sHop{40%{transform:translateY(-140px) scale(.97,1.04)}80%{transform:scale(1.06,.95)}}
#spud .fx{position:absolute;left:50%;top:-4px;pointer-events:none;font-size:18px;animation:sFx 1.2s ease-out forwards}
@keyframes sFx{from{opacity:1;transform:translate(-50%,0) scale(.6)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),-60px) scale(1.2)}}
#spud .mute{position:absolute;right:-8px;top:-4px;width:22px;height:22px;border-radius:50%;background:#fff;border:1.5px solid #2E5A37;font-size:11px;line-height:19px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
#spud .tip{position:absolute;left:50%;transform:translateX(-50%);top:100%;margin-top:9px;z-index:3;background:transparent;color:#3A2716;font:800 11px Poppins,sans-serif;white-space:nowrap;text-shadow:0 0 3px #F7F0E3,0 0 6px #F7F0E3;animation:sTip 5s forwards;pointer-events:none}
@keyframes sTip{0%,85%{opacity:1}100%{opacity:0}}
#spud.inhead{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:56px;height:72px}
.spudHost{position:relative;width:84px;height:84px;border-radius:50%;background:#F7F0E3;border:3px solid #2F5D3A;flex:none;box-shadow:0 3px 10px rgba(0,0,0,.18);overflow:visible;cursor:pointer}
@media(max-width:780px){.spudHost{width:72px;height:72px}#spud.inhead{width:48px;height:62px;bottom:5px}}
#spud .lid.half{transform:scaleY(.55)}
#spud.shake .bod{animation:sShake .5s 2}
@keyframes sShake{20%{transform:translateX(-30px) rotate(-4deg)}40%{transform:translateX(30px) rotate(4deg)}60%{transform:translateX(-20px)}80%{transform:translateX(20px)}}
#spud.shiver .bod{animation:sShiver .08s 18 linear}
@keyframes sShiver{50%{transform:translateX(-10px)}}
#spud.droop .bod{animation:sDroop 2s ease}
@keyframes sDroop{20%,80%{transform:scale(1.04,.92) rotate(-4deg)}}
#spud.tilt .bod{animation:sTilt 1.6s ease}
@keyframes sTilt{20%,75%{transform:rotate(16deg)}}
#spud.shy .bod{animation:sShy 1.6s ease}
@keyframes sShy{20%,75%{transform:rotate(-10deg) scale(.95,.97) translateX(-20px)}}
#spud.sneeze .bod{animation:sSneeze 1.2s ease}
@keyframes sSneeze{0%,50%{transform:rotate(0)}35%,55%{transform:rotate(-12deg) scale(.97,1.04)}65%{transform:rotate(14deg) translateX(30px) scale(1.08,.92)}80%{transform:rotate(-3deg)}}
#spud.hiccup .bod{animation:sHic .55s 3}
@keyframes sHic{15%{transform:translateY(-90px) scale(.96,1.05)}35%{transform:none}}
#spud.nod .bod{animation:sNod .4s 3}
@keyframes sNod{50%{transform:scale(1.04,.94) translateY(20px)}}
#spud.sway .bod{animation:sSway2 .9s 2 ease-in-out}
@keyframes sSway2{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
#spud.chew .bod{animation:sChew .25s 6}
@keyframes sChew{50%{transform:scale(1.05,.95)}}
#spud.sleep .bod{animation:sSleep 3.4s ease-in-out}
@keyframes sSleep{15%,85%{transform:rotate(-8deg) scale(1.02,.97)}50%{transform:rotate(-8deg) scale(1.05,.95)}}
#spud.stumble .bod{animation:sStum 1.2s ease}
@keyframes sStum{20%{transform:rotate(22deg) translateX(40px)}40%{transform:rotate(-16deg) translateX(-20px)}60%{transform:rotate(8deg)}80%{transform:rotate(-3deg)}}
#spud.grow .bod{animation:sGrow 1.1s ease}
@keyframes sGrow{30%,70%{transform:scale(1.18)}}
#spud.peek .bod{animation:sPeek 1.6s ease}
@keyframes sPeek{0%,55%{transform:scale(.92,1)}65%{transform:translateY(-80px) scale(1.06)}100%{transform:none}}
#spud svg{transition:transform .35s ease-out;transform-origin:50% 90%}
#spud svg.talking .mbig,#spud svg.talking .mtongue,#spud svg.talking .mo,#spud svg.talking .mfrown,#spud svg.talking .mwavy,#spud svg.talking .mkiss{visibility:hidden}
#spud svg.talking .mcover{opacity:1}
#spud .heart-pop{position:absolute;pointer-events:none}
#spud .say{position:absolute;left:50%;top:100%;margin-left:-48px;margin-top:12px;width:96px;z-index:4;background:transparent;color:#3A2716;font:800 12px/1.25 Poppins,sans-serif;text-align:left;white-space:normal;text-shadow:0 0 3px #F7F0E3,0 0 6px #F7F0E3,0 1px 0 #fff;pointer-events:none;animation:sSay 3.6s forwards}
@keyframes sSay{0%{opacity:0;transform:translateY(-4px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}
@media(max-width:780px){#spud .say{width:88px;margin-left:-44px;font-size:10.5px;margin-top:9px}}
#spud .say,#spud .tip{display:none!important}
</style>

<script>
(()=>{const el=document.getElementById("spud");if(!el)return;const q=s=>el.querySelector(s),qa=s=>el.querySelectorAll(s);
let AC=null,muted=false,touched=false;
const host=document.querySelector(".spudHost");if(host){host.appendChild(el);el.classList.add("inhead")}
const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();if(AC&&!window.__spPre){window.__spPre=1;getVO().then(()=>Object.keys(VO).forEach(loadV))}return AC};
function tone(f1,f2,dur,type="sine",vol=.16,delay=0){if(muted||!touched)return;const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(f2,30),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
const VO={};let VOP=null;const getVO=()=>VOP||(VOP=fetch("/img/spudvoiceb.json").then(r=>r.json()).then(j=>Object.assign(VO,j)).catch(()=>{}));setTimeout(getVO,2500);const BUF={};
async function loadV(k){if(BUF[k])return BUF[k];await getVO();if(!VO[k])return null;const a=ac();if(!a)return null;try{const r=await fetch(VO[k]);BUF[k]=await a.decodeAudioData(await r.arrayBuffer())}catch(e){BUF[k]=null}return BUF[k]}
let LIVE=null;let talking=0,AN=null,AD=null,raf=0;const SV=el.querySelector("svg"),MT1=el.querySelector(".mt1"),MT2=el.querySelector(".mt2");
function lips(){if(!LIVE&&(!AN||!talking)){SV.classList.remove("talking");MT1.setAttribute("rx",0);MT1.setAttribute("ry",0);MT2.setAttribute("rx",0);MT2.setAttribute("ry",0);raf=0;return}
 let o;if(LIVE){o=Math.min(1,(LIVE.getOutputVolume?LIVE.getOutputVolume():0)*2.2)}else{AN.getByteTimeDomainData(AD);let s2=0;for(let i=0;i<AD.length;i++){const x=(AD[i]-128)/128;s2+=x*x}o=Math.min(1,Math.max(0,(Math.sqrt(s2/AD.length)-.02)*5.5))}
 lips.v=o>(lips.v||0)?o:(lips.v||0)*.6+o*.4;o=lips.v;
 if(o>.06){SV.classList.add("talking");MT1.setAttribute("rx",(30+44*o).toFixed(1));MT1.setAttribute("ry",(8+34*o).toFixed(1));MT1.setAttribute("cy",(480+8*o).toFixed(1));MT2.setAttribute("rx",(o>.3?18+20*o:0).toFixed(1));MT2.setAttribute("ry",(o>.3?6+12*o:0).toFixed(1));MT2.setAttribute("cy",(488+22*o).toFixed(1))}
 else{SV.classList.remove("talking");MT1.setAttribute("rx",0);MT1.setAttribute("ry",0);MT2.setAttribute("rx",0);MT2.setAttribute("ry",0)}
 raf=requestAnimationFrame(lips)}
async function V(k,vol=1,delay=0){if(muted||!touched||!vol)return;const a=ac();if(!a)return;const b=await loadV(k);if(!b)return;if(!AN){AN=a.createAnalyser();AN.fftSize=512;AD=new Uint8Array(AN.fftSize);AN.connect(a.destination)}const s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.playbackRate.value=1+(Math.random()*.08-.04);s.connect(g).connect(AN);s.onended=()=>{talking=Math.max(0,talking-1)};setTimeout(()=>{talking++;if(!raf)raf=requestAnimationFrame(lips)},delay*1000);s.start(a.currentTime+delay)}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const S={boing:()=>{tone(180,620,.18,"sine",.18);tone(620,260,.28,"triangle",.1,.18)},pop:()=>tone(900,1500,.07,"sine",.16),
 squeak:()=>{tone(1200,1900,.08,"square",.04);tone(1900,1300,.1,"square",.035,.08)},thud:()=>{tone(160,50,.25,"sine",.3);tone(90,40,.2,"triangle",.18,.02)},
 whee:()=>tone(400,1400,.5,"triangle",.11),twinkle:()=>[1320,1760,2093].forEach((f,i)=>tone(f,f*1.01,.14,"sine",.09,i*.08)),
 giggle:()=>[900,1100,950,1150].forEach((f,i)=>tone(f,f*1.2,.07,"triangle",.08,i*.09)),dizzy:()=>[700,600,700,600,700].forEach((f,i)=>tone(f,f*.9,.1,"sine",.07,1.1+i*.1)),
 hop:()=>[0,.45].forEach(d=>tone(300,700,.12,"sine",.12,d))};
const op=(s,v)=>qa(s).forEach(n=>n.setAttribute("opacity",v));
const lid=(s,on)=>qa(s).forEach(n=>n.classList.toggle("shut",on));
function face(m){op(".mbig,.mtongue",m==="big"?1:0);op(".mo",m==="o"?1:0);op(".mfrown",m==="frown"?1:0);op(".mwavy",m==="wavy"?1:0);op(".mkiss",m==="kiss"?1:0);op(".mcover",["o","frown","wavy","kiss"].includes(m)?1:0);op(".blush",m==="big"?.45:0)}
function reset(){face("");lid(".lid",false);qa(".lid").forEach(n=>n.classList.remove("half"));op(".arcL,.arcR,.xs,.hearts,.angry,.sadb,.tear,.sweat",0)}
const half=on=>qa(".lid").forEach(n=>n.classList.toggle("half",on));const at=(ms,f)=>setTimeout(()=>{if(busy)f()},ms);
function fx(c,n=3){for(let i=0;i<n;i++){const s=document.createElement("span");s.className="fx";s.textContent=c[i%c.length];s.style.setProperty("--dx",(Math.random()*70-35)+"px");s.style.animationDelay=(i*.08)+"s";el.appendChild(s);setTimeout(()=>s.remove(),1500)}}
let busy=false,last=-1;
function play(cls,ms,before){busy=true;el.className=host?"inhead":"";void el.offsetWidth;reset();before&&before();el.classList.add(cls);setTimeout(()=>{el.className=(host?"inhead ":"")+"idle";reset();busy=false},ms)}
const A={
 jump:(v=1)=>play("jump",750,()=>{face("big");V(pick(["hey","yay"]),v);fx(["🧀","🥓"])}),
 fall:(v=1)=>play("fall",2350,()=>{face("o");V("whee",v);at(720,()=>{S.thud();V(pick(["ow","uhoh"]),v)});at(800,()=>{lid(".lid",true);op(".xs",1);face("")});at(1850,()=>{op(".xs",0);lid(".lid",false);face("big");V("hehe",v*.8)})}),
 wink:(v=1)=>play("wiggle",900,()=>{lid(".lidL",true);op(".arcL",1);face("big");V(pick(["hehe","hihi"]),v);fx(["🧈"],2)}),
 tickle:(v=1)=>play("squish",1800,()=>{lid(".lid",true);op(".arcL,.arcR",1);face("big");V("tickles",v);fx(["🧀","🥓"],3)}),
 spin:(v=1)=>play("spin",850,()=>{face("o");V(pick(["whee","ooh"]),v);fx(["🥔"],2)}),
 dance:(v=1)=>play("dance",1850,()=>{face("big");V("yay",v);fx(["🧀","🥓","🥔"],4)}),
 hop:(v=1)=>play("hop",900,()=>{face("big");V("hihi",v)}),
 sleepy:(v=1)=>play("sleep",3400,()=>{half(true);face("o");V("yawn",v);at(1000,()=>{half(false);lid(".lid",true);op(".arcL,.arcR",0);face("");fx(["💤","z","Z"],3);V("zzz",v*.7)})}),
 sneeze:(v=1)=>play("sneeze",1200,()=>{half(true);face("o");at(650,()=>{half(false);lid(".lid",true);face("big");V("achoo",v);fx(["💨","🧂"],3)})}),

 peekaboo:(v=1)=>play("peek",1600,()=>{lid(".lid",true);face("");at(850,()=>{lid(".lid",false);face("big");V("peekaboo",v);fx(["🥓","🧀"],2)})}),

 eat:(v=1)=>play("chew",1550,()=>{lid(".lid",true);op(".arcL,.arcR",1);face("big");V("nomnom",v);fx(["🥔","🧀"],2);let k=0;const t=setInterval(()=>{if(!busy){clearInterval(t);return}face(k++%2?"big":"o")},200);at(1500,()=>clearInterval(t))}),

 oops:(v=1)=>play("stumble",1200,()=>{face("o");op(".sweat",1);V("oopsie",v)}),

function bub(t){return;qa(".say,.tip").forEach(n=>n.remove());const b=document.createElement("div");b.className="say";b.textContent=t;el.appendChild(b);setTimeout(()=>b.remove(),3700)}
function orderLine(){const h=new Date().getHours();if(h<11)return["o_pm","Order by 11 AM → at your door by 4 PM"];if(h<15)return["o_eve","Order by 3 PM → at your door by 9 PM"];if(h<19)return["o_am","Order by 7 PM → at your door by 11 AM"];return["o_pm","Order by 11 AM → at your door by 4 PM"]}
const PITCH=[["bruh","Bruh, you gotta try it 🥔"],["hella","It's hella good!"],["five","5 meals — eat some now, eat some later"],["fam","Order for the whole family"],["reheat","Reheats so good 🔥"],null];
const NOISE=["mmhm","oowee","laugh","ahh","whistle","yes"];
A.pitch=(v=1)=>{let p=rnd2(PITCH);if(!p)p=orderLine();play("nod",1300,()=>{face("big");V(p[0],v);bub(p[1])})};
A.vibe=(v=1)=>play(Math.random()<.5?"sway":"hop",1200,()=>{face("big");V(NOISE[Math.floor(Math.random()*NOISE.length)],v);fx(["🧀","🥓","🥔"],3)});
function rnd2(l){return l[Math.floor(Math.random()*l.length)]}

const tapList=Object.keys(A);
const autoList=Object.keys(A).filter(k=>!["sleepy","sad"].includes(k)).concat(["wiggleOnly"]);
function rnd(list){let i;do{i=Math.floor(Math.random()*list.length)}while(i===last&&list.length>1);last=i;return list[i]}
el.addEventListener("click",e=>{
 touched=true;ac();const t=q(".tip");if(t)t.remove();if(busy)return;const r=Math.random();r<.5?A.pitch():r<.65?A.vibe():A[rnd(tapList)]()});
// automatic life: blinks + random moves on their own (silent until visitor taps once)
function blink(){if(!busy)qa(".lid").forEach(n=>{n.classList.remove("blink");void n.getBBox();n.classList.add("blink")});setTimeout(blink,2200+Math.random()*2600)}
setTimeout(blink,1500);
function auto(){if(!busy&&!document.hidden){const k=rnd(autoList);k==="wiggleOnly"?play("wiggle",750,()=>face("big")):A[k](Math.random()<.35?.8:0)}setTimeout(auto,4500+Math.random()*4000)}
setTimeout(auto,2500);
// smart upsell: reacts to what they pick
const BL={chicken:["b_chicken","Chicken Bacon Ranch = #1 best seller 🔥"],steak:["b_steak","Eating like a boss 🥩"],bbq:["b_bbq","Smoky, saucy, hella good"],pork:["b_pork","Pulled pork + crispy onions 👌"],sweet:["b_sweet","Light, clean & still loaded 🍠"],classic:["b_classic","Can't go wrong with the OG"],country:["b_country","Breakfast handled all week 🍳"],supreme:["b_supreme","My favorite, no cap 🥔"]};
const UP={u_bacon:"Add extra bacon? +$10/pack 🥓",u_steak:"Add extra steak? Protein bomb 💪",u_cheese:"Extra cheese? +$5/pack 🧀",u_second:"2nd pack: one now, one for the freezer ❄️",u_family:"Feeding the fam? Add another pack 👨‍👩‍👧",u_breakfast:"Lunch covered — add a breakfast pack? 🍳"};
let lastUp=0;const seen={};
async function say(k,t){if(!touched)return 0;const b=await loadV(k);V(k);if(t)bub(t);return b?b.duration:1.5}
function upsell(id){const C=typeof cart!=="undefined"?cart:null;if(!C||Date.now()-lastUp<15000)return null;const c=C[id]||{packs:0,adds:[]};const tot=Object.values(C).reduce((s,x)=>s+x.packs,0);const bk=["country","supreme"];const hasBk=bk.some(k=>C[k]&&C[k].packs);const o=[];
 if(id==="steak"&&!c.adds.includes("xsteak"))o.push("u_steak");if(id!=="sweet"&&!c.adds.includes("bacon"))o.push("u_bacon");if(!c.adds.includes("cheese"))o.push("u_cheese");
 if(c.packs===1)o.push("u_second");if(tot<3)o.push("u_family");if(!hasBk&&!bk.includes(id))o.push("u_breakfast");
 if(!o.length)return null;lastUp=Date.now();return o[Math.floor(Math.random()*o.length)]}
document.addEventListener("click",async e=>{const b=e.target.closest('button[data-d="1"]');if(!b||el.contains(b))return;touched=true;ac();const id=b.dataset.b;
 play("hop",900,()=>face("big"));fx(["🧀","🥓","🥔"],3);
 setTimeout(async()=>{let dur;if(!seen[id]&&BL[id]){seen[id]=1;dur=await say(BL[id][0],BL[id][1])}else{dur=await say(Math.random()<.5?"yummy":"oowee","")}
  const u=upsell(id);if(u)setTimeout(()=>{say(u,UP[u]);if(!busy)play("nod",1200,()=>face("big"))},(dur+.7)*1000)},60)});
document.addEventListener("change",e=>{const t=e.target;if(!t.dataset||!t.dataset.a||!t.checked)return;touched=true;ac();say("nowtalk","Now we're talking 😋");fx(["🧀","🥓"],3);if(!busy)play("hop",900,()=>face("big"))});

// look toward the visitor's finger/mouse
let lookT=0;addEventListener("pointermove",e=>{const r=el.getBoundingClientRect();const dx=(e.clientX-(r.left+r.width/2))/innerWidth;SV.style.transform=`rotate(${Math.max(-10,Math.min(10,dx*22)).toFixed(1)}deg)`;clearTimeout(lookT);lookT=setTimeout(()=>SV.style.transform="",1800)},{passive:true});
// rub / pet him -> giggles
let rub=0,rubT=0;el.addEventListener("pointermove",()=>{rub++;clearTimeout(rubT);rubT=setTimeout(()=>rub=0,500);if(rub>14&&!busy){rub=0;touched=true;ac();A.tickle()}},{passive:true});
// cart reactions
const bar=document.getElementById("barTxt");let lastB=0,cheered=false;
if(bar)new MutationObserver(()=>{const n=parseInt(bar.textContent)||0;if(n>=10&&!cheered&&n>lastB){cheered=true;setTimeout(()=>{if(!busy){A.dance()}},950)}if(n<10)cheered=false;lastB=n}).observe(bar,{childList:true,characterData:true,subtree:true});
document.addEventListener("click",e=>{const m=e.target.closest('button[data-d="-1"]');if(m&&!busy){touched=true;ac();play("droop",1100,()=>{op(".sadb",1);face("frown");V("uhoh",.8)})}
 const c=e.target.closest('a[href="#checkout"],#go');if(c&&!el.contains(c)){touched=true;ac();if(!busy)A.love(0);setTimeout(()=>say("goodchoice","Good choice — future you says thanks 🙏"),300)}},true);
// gets sleepy if nobody plays with him
let idleAt=Date.now();["pointerdown","scroll","keydown"].forEach(ev=>addEventListener(ev,()=>{idleAt=Date.now()},{passive:true}));
setInterval(()=>{if(!busy&&Date.now()-idleAt>40000&&!document.hidden){idleAt=Date.now();A.sleepy(.5)}},5000);
// say hi when visitor comes back to the tab
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&touched&&!busy)setTimeout(()=>A.jump(.8),400)});
})();
</script>
